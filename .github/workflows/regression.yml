name: Regression

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hub-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUB_TEST_DOCKER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: docker build --tag agent-collab-sandbox:local sandbox/
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e
      - run: npm audit

  native-launcher:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run launcher:build
