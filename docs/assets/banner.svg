    <radialGradient id="glow" cx=".78" cy=".5" r=".45"><stop stop-color="#82aaff" stop-opacity=".18"/><stop offset="1" stop-color="#82aaff" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#4b5b79" stroke-opacity=".18"/></pattern>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#grid)"/>
  <rect width="1280" height="400" rx="24" fill="url(#glow)"/>
  <g transform="translate(830 200)">
