    </g>
    <g fill="#151d2b" stroke-width="6">
      <rect x="-26" y="-154" width="52" height="52" rx="16" stroke="#7ee2b8"/>
      <rect x="-137" y="38" width="52" height="52" rx="16" stroke="#82aaff"/>
